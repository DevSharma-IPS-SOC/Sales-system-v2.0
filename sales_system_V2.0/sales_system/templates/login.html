<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sales Analysis System</title>
    <style>
        :root { --primary: #2c8cfb; --primary-dark: #1a5fb4; --white: #fff; --text: #2d3748; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh; display:flex; justify-content:center; align-items:center; padding:20px;
        }
        .login-container {
            background: var(--white); border-radius:16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding:40px; width:100%; max-width:420px;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { opacity:0; transform:translateY(-30px); } to { opacity:1; transform:translateY(0); } }
        .logo { text-align:center; margin-bottom:30px; }
        .logo h1 { color:var(--primary); font-size:2em; margin-bottom:5px; }
        .logo p { color:#666; font-size:0.9em; }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; margin-bottom:8px; color:var(--text); font-weight:600; font-size:0.9em; }
        .form-group input {
            width:100%; padding:12px 16px; border:2px solid #e2e8f0;
            border-radius:8px; font-size:1em; transition:all 0.3s;
        }
        .form-group input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(44,140,251,0.1); }
        .btn-login {
            width:100%; padding:14px; background:var(--primary); color:var(--white);
            border:none; border-radius:8px; font-size:1em; font-weight:600;
            cursor:pointer; transition:all 0.3s;
        }
        .btn-login:hover { background:var(--primary-dark); transform:translateY(-2px); box-shadow:0 6px 20px rgba(44,140,251,0.3); }
        .btn-login:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .error-message {
            background:#fee; color:#c33; padding:12px; border-radius:8px;
            margin-bottom:20px; display:none; border-left:4px solid #c33;
        }
        .demo-creds {
            background:#e6f4ff; border-left:4px solid var(--primary);
            padding:14px; margin-top:20px; border-radius:8px; font-size:0.85em;
        }
        .demo-creds strong { color:var(--primary); display:block; margin-bottom:6px; }
        .demo-creds code { background:#d0e8ff; padding:2px 6px; border-radius:4px; }
        .loading { display:none; text-align:center; color:var(--primary); margin-top:10px; font-size:0.9em; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Sales Analysis</h1>
            <p>Inventory & Billing System</p>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autocomplete="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="Enter password">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Login</button>
            <div class="loading" id="loading">Signing in...</div>
        </form>
        <div class="demo-creds">
            <strong>Demo Credentials</strong>
            Admin: <code>Admin</code> / <code>Admin123</code>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            loginBtn.disabled = true;
            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.textContent = data.message || 'Invalid credentials';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loading.style.display = 'none';
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
